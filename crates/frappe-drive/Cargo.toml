[package]
name = "frappe-drive"
version = "0.1.0"
edition = "2024"

[dependencies]
yrs = "0.27.0"
kube = { version = "3.1.0", features = ["runtime", "client", "derive"] }
k8s-openapi = { version = "0.27.1", features = ["v1_31"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.52.3", features = ["full"] }
