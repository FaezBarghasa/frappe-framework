[workspace]
resolver = "2"
members = [
    "crates/frappe-net",
    "crates/frappe-meta",
    "crates/frappe-storage",
    "crates/frappe-insights",
    "crates/frappe-builder",
    "crates/frappe-drive",
]

[package]
name = "frappe-framework"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1.89"
rhai = { version = "1.19.0", features = ["sync"] }
frappe-meta = { path = "crates/frappe-meta" }
surrealdb = { version = "3.0.5", features = ["protocol-ws", "rustls"] }
log = "0.4"

